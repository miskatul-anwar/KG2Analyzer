[project]
name = "kg2analyzer"
version = "1.0.0"
description = "Multidimensional analytics and natural-language querying across knowledge graphs"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.1",
    "networkx>=3.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pandas>=3.1.1",
    "tabulate>=0.10.0",
    "owlrl>=7.6.2",
    "pyoxigraph>=0.5.13",
    "model2vec>=0.10.0",
]

[project.scripts]
kg2analyzer = "kg2analyzer.__main__:main"

[project.optional-dependencies]
tev1 = [
    "accelerate>=1.16.0",
    "torch>=2.15.0",
    "transformers>=5.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg2analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
